<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Weight Capacity Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 600px;
            margin-top: 50px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #343a40;
        }

        label {
            font-weight: bold;
            color: #495057;
        }

        .form-control,
        .form-select {
            margin-bottom: 15px;
        }

        .btn-primary {
            width: 100%;
            font-size: 18px;
            padding: 10px;
        }

        .result {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Material Weight Capacity Calculator</h1>

        <div class="mb-3">
            <label for="material" class="form-label">Material Type:</label>
            <select id="material" class="form-select">
                <option value="MDF">MDF</option>
                <option value="Plywood">Plywood</option>
                <option value="Steel">Steel</option>
                <!-- Add more materials as needed -->
            </select>
        </div>

        <div class="mb-3">
            <label for="thickness" class="form-label">Thickness (mm):</label>
            <input type="number" id="thickness" class="form-control" placeholder="e.g., 12">
        </div>

        <div class="mb-3">
            <label for="length" class="form-label">Length (inches):</label>
            <input type="number" id="length" class="form-control" placeholder="e.g., 36">
        </div>

        <div class="mb-3">
            <label for="width" class="form-label">Width (inches):</label>
            <input type="number" id="width" class="form-control" placeholder="e.g., 20">
        </div>

        <div class="mb-3">
            <label for="load" class="form-label">Load (kg):</label>
            <input type="number" id="load" class="form-control" placeholder="e.g., 40">
        </div>

        <div class="mb-3">
            <label for="loadType" class="form-label">Load Type:</label>
            <select id="loadType" class="form-select">
                <option value="uniform">Uniformly Distributed Load</option>
                <option value="point">Point Load at Center</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="supportType" class="form-label">Support Type:</label>
            <select id="supportType" class="form-select">
                <option value="allEdges">Supported on All Edges</option>
                <option value="twoEdges">Supported on Two Opposite Edges</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="calculateCapacity()">Calculate</button>

        <div class="result alert alert-info mt-4" id="result"></div>
    </div>

    <script src="calc.js"></script>
</body>

</html>
